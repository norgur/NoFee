services:
  nofee-music:
    image: ghcr.io/norgur/nofee:latest
    ports:
      - "3000:3000"
    volumes:
      - ./music:/music:ro
    environment:
      - PORT=3000
      - MUSIC_DIR=/music
    restart: unless-stopped
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "nofee-music"
      tsdproxy.container_port: "3000"
